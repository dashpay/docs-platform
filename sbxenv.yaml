# Docker Sandboxes environment definition for working on Dash Platform docs.
# Configures workspace mounts, agent tools, networking, and build dependencies.
# Usage: sbx env run ./sbxenv.yaml (creates the sandbox if needed, then attaches).
schemaVersion: "1"
name: platform-docs
# Claude is the default agent; the T3 kit provides remote access below.
# Setup installs the Node 22 major version and Python 3.10 to match .readthedocs.yml.
# npm comes from the agent image and is not pinned here.
agent: claude

# Checkout paths resolve relative to this file. Override a checkout location
# with --env-arg, e.g. --env-arg mainDocs=/path/to/dashpay-docs.
args:
  mainDocs:
    default: ../dashpay-docs
  coreSource:
    default: ../dash
  platformSource:
    default: ../platform
  dips:
    default: ../dips

  sandboxPath:
    description: Sandbox PATH shared by env.PATH and the postCreate exec steps.
    default: /home/agent/docs-venv/bin:/home/agent/.local/bin:/usr/local/share/npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

# Primary docs checkout: read-write. This file must stay in the repo root;
# "." refers to this file directory, not the shell current directory.
workspace: .

additionalWorkspaces:
  # User docs checkout: read-only reference material.
  - path: ${{ env.args.mainDocs }}
    readOnly: true
  # Source repositories for reference: read-only.
  - path: ${{ env.args.coreSource }}
    readOnly: true
  - path: ${{ env.args.platformSource }}
    readOnly: true
  - path: ${{ env.args.dips }}
    readOnly: true

kits:
  - docker.io/sbx/t3code-kit:latest

# Explicit sandbox PATH makes user-installed CLIs available to SSH/T3 sessions.
# sandboxPath is shared with explicit sbx exec environments below.
# sbx passes env values literally, so do not use $HOME or $PATH here.
env:
  PATH: ${{ env.args.sandboxPath }}

sandboxOptions:
  cpus: 4
  memory: 4g

# Optional preview port; publish on demand with:
# sbx ports platform-docs --publish 8000:8000
#
# ports:
#   - sandbox: 8000
#     host: 8000

lifecycle:
  initialize:
    - name: Verify primary workspace is the Platform docs repo root
      workdir: ${{ env.fileDir }}
      command: |
        if [ ! -f conf.py ] || [ ! -f requirements.txt ] ||
           [ ! -f index.md ] || [ ! -f Makefile ] ||
           [ ! -d docs ] || [ ! -f package.json ] || [ ! -f package-lock.json ]; then
          echo "Expected sbxenv.yaml in the Platform docs repo root (conf.py, requirements.txt, index.md, Makefile, docs, package.json, package-lock.json)." >&2
          exit 1
        fi
  postCreate:
    - name: Configure sandbox network allowances
      command: |
        # Add future allowed destinations here (one host:port per line).
        # Python/uv and npm downloads, Sphinx inventories, and Read the Docs redirects.
        for destination in \
          astral.sh:443 \
          releases.astral.sh:443 \
          github.com:443 \
          release-assets.githubusercontent.com:443 \
          registry.npmjs.org:443 \
          pypi.org:443 \
          files.pythonhosted.org:443 \
          docs.dash.org:443 \
          readthedocs.io:443 \
          "**.readthedocs.io:443" \
          readthedocs.org:443 \
          "**.readthedocs.org:443"
        do
          sbx policy allow network --sandbox "$SBX_SANDBOX_NAME" "$destination" || exit 1
        done
    - name: Install Node 22 for Platform docs
      timeout: 10m
      command: |
        sbx exec --env "PATH=${{ env.args.sandboxPath }}" "$SBX_SANDBOX_NAME" -- sh -eu -c '
          npm install -g --prefix "$HOME/.local" node@22
          "$HOME/.local/bin/node" --version
          case "$(node --version)" in
            v22.*) ;;
            *) echo "Expected Node 22 on PATH" >&2; exit 1 ;;
          esac
          npm --version
        '
    # Keep Claude as the default and make Codex available as another agent.
    - name: Install Codex CLI
      timeout: 10m
      command: |
        # Install as the regular sandbox user; scope the prefix to this install.
        sbx exec --env "PATH=${{ env.args.sandboxPath }}" "$SBX_SANDBOX_NAME" -- sh -eu -c '
          npm install -g --prefix "$HOME/.local" @openai/codex
        '
        sbx exec --env "PATH=${{ env.args.sandboxPath }}" "$SBX_SANDBOX_NAME" -- /home/agent/.local/bin/codex --version
    - name: Install Python 3.10 and Platform docs dependencies
      timeout: 10m
      command: |
        sbx exec --env "PATH=${{ env.args.sandboxPath }}" --workdir "$SBX_WORKSPACE" "$SBX_SANDBOX_NAME" -- sh -eu -c '
          installer=$(mktemp)
          curl -LsSf https://astral.sh/uv/install.sh -o "$installer"
          sh "$installer"
          rm -f "$installer"
          "$HOME/.local/bin/uv" python install 3.10
          # Sandbox-local venv for building the Platform docs.
          "$HOME/.local/bin/uv" venv --python 3.10 /home/agent/docs-venv
          "$HOME/.local/bin/uv" pip install \
            --python /home/agent/docs-venv/bin/python \
            -r requirements.txt
        '
    # This replaces node_modules in the mounted checkout (including native binaries).
    # Run builds explicitly after setup; no HTML or SDK bundle is generated here.
    - name: Install JavaScript dependencies
      timeout: 10m
      command: |
        sbx exec --env "PATH=${{ env.args.sandboxPath }}" --workdir "$SBX_WORKSPACE" "$SBX_SANDBOX_NAME" -- sh -eu -c '
          make sdk-install
        '
